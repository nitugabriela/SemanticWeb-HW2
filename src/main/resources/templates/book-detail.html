<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="page-type" content="book-detail"/>
    <meta name="page-book-title" th:content="${book['label']}"/>
    <title th:text="${book['label']} + ' - Book Details'">Book Details</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            color: #333;
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        nav {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        nav a {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }

        .field {
            margin-bottom: 1.2rem;
        }

        .field-label {
            font-weight: 700;
            color: #0056b3;
            margin-bottom: 4px;
        }

        .field-value {
            font-size: 1rem;
        }

        .tag {
            display: inline-block;
            background: #e8f0fe;
            color: #0056b3;
            padding: 3px 10px;
            border-radius: 12px;
            margin: 2px;
            font-size: 0.9rem;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<nav><a href="/books">Back to Book List</a></nav>

<div th:if="${error}" class="error" th:text="${error}"></div>

<div th:if="${book}" class="card">
    <h1 th:text="${book['label']}">Book Title</h1>

    <div class="field">
        <div class="field-label">Reading Level</div>
        <div class="field-value" th:text="${book['readingLevel']}">Level</div>
    </div>

    <div class="field">
        <div class="field-label">Themes</div>
        <div class="field-value">
            <span th:each="theme : ${book['themes']}" class="tag" th:text="${theme}">Theme</span>
        </div>
    </div>

    <div class="field">
        <div class="field-label">RDF URI</div>
        <div class="field-value" th:text="${book['uri']}">URI</div>
    </div>
</div>
<div th:replace="~{fragments/chatbotWidget :: chat}"></div>
</body>
</html>
