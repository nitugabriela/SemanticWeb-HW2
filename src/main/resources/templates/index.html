<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDF Graph Visualizer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; color: #333; max-width: 860px; margin: 0 auto; padding: 2rem; }
        h1 { text-align: center; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #666; margin-bottom: 2rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 2rem; text-align: center; }
        .btn { display: inline-block; padding: 10px 20px; background: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 1rem; margin: 5px; }
        .btn:hover { background: #003d80; }
        input[type=file] { margin: 10px 0; }
    </style>
</head>
<body>
<h1>RDF Graph Visualizer</h1>
<p class="subtitle">Upload an RDF/XML file to visualize its structure.</p>

<div class="card">
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".rdf,.xml,.owl"/>
        <br/>
        <button type="submit" class="btn">Upload &amp; Visualize</button>
    </form>
    <br/>
    <a href="/books" class="btn">All Books</a>
    <a href="/books/manage" class="btn">Manage Books</a>
</div>

<div th:replace="~{fragments/chatbotWidget :: chat}"></div>
</body>
</html>
