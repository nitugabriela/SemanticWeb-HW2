<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Manage Books</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            color: #333;
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        h2 {
            margin-bottom: 1.2rem;
            color: #0056b3;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }

        input[type="text"], select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            background: #0056b3;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #004494;
        }

        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 3px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 1rem;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 1rem;
            border: 1px solid #f5c6cb;
        }

        nav {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        nav a {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<nav><a href="/">Back to RDF Visualizer</a></nav>
<h1>Manage Books</h1>

<div th:if="${success}" class="success" th:text="${success}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>

<div class="card">
    <h2>Add a New Book</h2>
    <form method="POST" action="/books/add">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="ex Harry Potter" required/>
        </div>
        <div class="form-group">
            <label for="themes">Themes</label>
            <input type="text" id="themes" name="themes" placeholder="ex Fantasy, Adventure"/>
            <span class="hint">Separate multiple themes with a comma.</span>
        </div>
        <div class="form-group">
            <label for="readingLevel">Reading Level</label>
            <select id="readingLevel" name="readingLevel">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>
        <button type="submit">Add Book</button>
    </form>
</div>

<div class="card">
    <h2>Edit Book Reading Level</h2>
    <form method="POST" action="/books/edit">
        <div class="form-group">
            <label for="bookUri">Select Book</label>
            <select id="bookUri" name="bookUri">
                <option th:each="book : ${books}"
                        th:value="${book['uri']}"
                        th:text="${book['label']}">Book
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="newReadingLevel">New Reading Level</label>
            <select id="newReadingLevel" name="newReadingLevel">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>
        <button type="submit">Update Level</button>
    </form>
</div>
<div th:replace="~{fragments/chatbotWidget :: chat}"></div>
</body>
</html>
